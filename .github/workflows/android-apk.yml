name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'android-apk/**'
      - '.github/workflows/android-apk.yml'
      - 'manifest.webmanifest'
      - 'sw.js'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build direct Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the current parking app into Android assets
        run: |
          rm -rf android-apk/app/src/main/assets/www
          mkdir -p android-apk/app/src/main/assets/www
          mkdir -p android-apk/app/src/main/res/drawable
          cp -R app android-apk/app/src/main/assets/www/
          cp -R assets android-apk/app/src/main/assets/www/
          cp manifest.webmanifest sw.js android-apk/app/src/main/assets/www/
          cp assets/icon-512.png android-apk/app/src/main/res/drawable/sri_kaliamman_icon.png

      - name: Compile direct-install APK
        run: gradle --no-daemon -p android-apk :app:assembleDebug

      - name: Prepare APK download
        run: |
          mkdir -p android-apk/dist
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk android-apk/dist/Sri-Kaliamman-Parking.apk

      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Kaliamman-Parking-APK
          path: android-apk/dist/Sri-Kaliamman-Parking.apk
          if-no-files-found: error

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.0 > /dev/null 2>&1; then
            gh release upload android-v1.0.0 android-apk/dist/Sri-Kaliamman-Parking.apk --clobber
          else
            gh release create android-v1.0.0 android-apk/dist/Sri-Kaliamman-Parking.apk --title "Sri Kaliamman Parking APK" --notes "Direct Android APK build for Sri Kaliamman Parking."
          fi
