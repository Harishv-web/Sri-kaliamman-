plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harishv.srikaliammanparking'
    compileSdk 35

    defaultConfig {
        applicationId 'com.harishv.srikaliammanparking'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
